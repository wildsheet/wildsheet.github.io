<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildsheet Community — Tissue Clearing Database</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        html, body { background-color: #030712 !important; color: #f8fafc !important; font-family: sans-serif; }
        iframe.giscus-frame { background-color: #0f172a !important; border-radius: 12px; padding: 16px; border: 1px solid #1e293b !important; }
    </style>
</head>
<body class="min-h-screen antialiased selection:bg-blue-500/30 selection:text-blue-100">

    <!-- Global Minimal Navigation Menu -->
    <nav class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50 px-6 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            
            <!-- Brand Header Container with Group Logo -->
            <div class="flex items-center gap-3 select-none">
                <!-- 🎯 Group Logo Integration Node -->
                <img src="images/wildsheet_logo.png" 
                    alt="WildSheet Logo" 
                    class="h-7 w-auto object-contain brightness-110 tracking-tight"
                    onerror="this.style.display='none';">
                    
                <!-- 🎯 This uses pure HTML inline styling to bypass Tailwind and force a 24px font size instantly -->
                <span class="font-black tracking-wider text-slate-100 uppercase" style="font-size: 50px !important;">
                    Wildsheet Light Sheet Community
                </span>
            </div>
            
            <!-- Navigation Tabs Link Tree -->
            <div class="flex items-center gap-6 text-sm font-semibold tracking-tight">
                <!-- Note: Apply the "text-blue-400 border-b-2 border-blue-500" classes to whichever page is currently active -->
                <a href="index.html" class="text-slate-400 hover:text-slate-100 transition-all pb-1 border-b-2 border-transparent">Overview</a>
                <a href="registry.html" class="text-slate-400 hover:text-slate-100 transition-all pb-1 border-b-2 border-transparent">Clearing Registry</a>
                <a href="events.html" class="text-slate-400 hover:text-slate-100 transition-all pb-1 border-b-2 border-transparent">Events</a>
            </div>
        </div>
    </nav>

    <!-- Main Workspace Content -->
    <main class="max-w-4xl mx-auto p-6 md:p-12">
        <section class="space-y-8">
            <header class="space-y-2">
                <h2 class="text-3xl font-extrabold tracking-tight text-slate-100">Tissue Clearing Database</h2>
                <p class="text-sm text-slate-400">Proven combinations for endogenous fluorescence preservation and refractive index matching.</p>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">
                <div class="md:col-span-1 space-y-4 bg-slate-900/40 p-4 rounded-xl border border-slate-800 shadow-inner">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Target Organ</label>
                        <select id="tissue-filter" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500">
                            <option value="all">Show All Organs</option>
                            <option value="brain">Brain</option>
                            <option value="heart">Heart</option>
                            <option value="lung">Lung</option>
                            <option value="kidney">Kidney</option>
                        </select>
                    </div>
                </div>
                <div id="registry-cards-container" class="md:col-span-2 space-y-3">
                    <!-- Cards injection hook -->
                </div>
            </div>

            <div class="border-t border-slate-800 pt-6 mt-8">
                <h3 id="wiki-title" class="text-sm font-bold text-slate-300 mb-4 tracking-tight">💬 Community Notes Panel</h3>
                <div id="giscus-frame-container" class="min-h-[280px]">
                    <!-- Giscus Mount Script -->
                    <script src="https://giscus.app"
                            data-repo="wildsheet/wildsheet.github.io"
                            data-repo-id="R_kgDOUOWJeg"
                            data-category="General"
                            data-category-id="DIC_kwDOUOWJes4DE315"
                            data-mapping="specific"
                            data-term="iDISCO-Plus"
                            data-strict="0"
                            data-reactions-enabled="1"
                            data-emit-metadata="0"
                            data-input-position="top"
                            data-theme="dark_dimmed"
                            data-lang="en"
                            crossorigin="anonymous"
                            async>
                    </script>
                </div>
            </div>
        </section>
    </main>

    <!-- Runtime Advanced Multi-Filter Client Engine -->
    <script>
                let cachedMethodsRegistry = [];
        let activeMethodId = window.location.hash.replace('#', '') || '';
        let isFocusModeActive = false;

        // 1. Asynchronously fetch the JSON file produced by your Python repo script
        async function bootstrapRegistryData() {
            try {
                const response = await fetch('tissue_clearing_db.json');
                if (!response.ok) throw new Error('Data pipeline network target offline.');
                
                const data = await response.json();
                cachedMethodsRegistry = data.clearing_methods || [];
                
                if (activeMethodId) {
                    const validMethod = cachedMethodsRegistry.find(m => m.method_name === activeMethodId);
                    if (validMethod) isFocusModeActive = true;
                } else if (cachedMethodsRegistry.length > 0) {
                    activeMethodId = cachedMethodsRegistry.method_name;
                }
                
                populateDynamicDropdownFilters();
                renderFilteredRegistry();
            } catch (error) {
                console.error("Pipeline Sync Error:", error);
                document.getElementById('registry-cards-container').innerHTML = `
                    <div class="p-8 text-center text-red-400 bg-red-950/20 rounded-xl border border-red-900 text-sm font-medium">
                        ❌ Error loading tissue_clearing_db.json. Ensure the file is named correctly and placed in the same folder.
                    </div>`;
            }
        }

        // 2. Scan dataset records to programmatically populate multi-variable search criteria cleanly
        function populateDynamicDropdownFilters() {
            const classes = new Set();
            const ris = new Set();
            const species = new Set();
            const years = new Set();

            cachedMethodsRegistry.forEach(m => {
                if (m.chemical_class) classes.add(m.chemical_class.trim());
                if (m.refractive_index) ris.add(m.refractive_index);
                if (m.year_invented) years.add(m.year_invented);
                if (m.tissue_compatibilities) {
                    m.tissue_compatibilities.forEach(t => species.add(t.trim()));
                }
            });

            const leftSidebar = document.getElementById('tissue-filter').parentNode.parentNode;
            leftSidebar.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Live Parameter Search</label>
                        <input id="text-search" type="text" placeholder="Search title, year, RI, tissue..." class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 placeholder-slate-600 shadow-inner">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Target Host Species</label>
                        <select id="tissue-filter" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer shadow-inner">
                            <option value="all">Show All Species</option>
                            ${Array.from(species).sort().map(s => `<option value="${s}">${s}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Biochemical Strategy</label>
                        <select id="class-filter" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer shadow-inner">
                            <option value="all">Show All Classes</option>
                            ${Array.from(classes).sort().map(c => `<option value="${c}">${c}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Refractive Index (RI)</label>
                        <select id="ri-filter" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer shadow-inner">
                            <option value="all">Show All RIs</option>
                            ${Array.from(ris).sort((a,b) => b-a).map(r => `<option value="${r}">RI — ${r}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Invention Year</label>
                        <select id="year-filter" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer shadow-inner">
                            <option value="all">Show All Years</option>
                            ${Array.from(years).sort((a,b) => b-a).map(y => `<option value="${y}">${y}</option>`).join('')}
                        </select>
                    </div>
                </div>
            `;

            document.getElementById('text-search').addEventListener('input', renderFilteredRegistry);
            document.getElementById('tissue-filter').addEventListener('change', renderFilteredRegistry);
            document.getElementById('class-filter').addEventListener('change', renderFilteredRegistry);
            document.getElementById('ri-filter').addEventListener('change', renderFilteredRegistry);
            document.getElementById('year-filter').addEventListener('change', renderFilteredRegistry);
        }
        // 3. Multi-Variable Multi-Filter Dynamic Layout Engine
        function renderFilteredRegistry() {
            const query = document.getElementById('text-search').value.toLowerCase().trim();
            const selectedTissue = document.getElementById('tissue-filter').value;
            const selectedClass = document.getElementById('class-filter').value;
            const selectedRI = document.getElementById('ri-filter').value;
            const selectedYear = document.getElementById('year-filter').value;
            const container = document.getElementById('registry-cards-container');

            let filtered = cachedMethodsRegistry.filter(m => {
                const matchesTissue = selectedTissue === 'all' || (m.tissue_compatibilities && m.tissue_compatibilities.includes(selectedTissue));
                const matchesClass = selectedClass === 'all' || m.chemical_class === selectedClass;
                const matchesRI = selectedRI === 'all' || String(m.refractive_index) === selectedRI;
                const matchesYear = selectedYear === 'all' || String(m.year_invented) === selectedYear;

                const textHaystack = `${m.method_name} ${m.year_invented} ${m.chemical_class} ${m.refractive_index} ${m.sample_size_compatibility} ${(m.tissue_compatibilities || []).join(' ')}`.toLowerCase();
                const matchesText = !query || textHaystack.includes(query);

                return matchesTissue && matchesClass && matchesRI && matchesYear && matchesText;
            });

            // 🎯 Show Giscus only if Focus Mode is Active
            if (isFocusModeActive && activeMethodId) {
                const targetRecord = cachedMethodsRegistry.find(m => m.method_name === activeMethodId);
                if (targetRecord) {
                    container.innerHTML = `
                        <div class="mb-4">
                            <button onclick="exitFocusViewMode()" class="mb-3 text-xs font-bold text-blue-400 hover:text-blue-300 transition flex items-center gap-1.5 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg shadow-sm">
                                &larr; Return to Complete Protocol List
                            </button>
                        </div>
                        ${buildCardTemplateHtml(targetRecord, true)}
                    `;
                    // Make discussion element container area visible
                    document.getElementById('wiki-title').style.display = 'block';
                    document.getElementById('giscus-frame-container').style.display = 'block';
                    syncGiscusFrameContext();
                    return;
                }
            }

            // Hide the discussion panel when viewing the general scroll list
            document.getElementById('wiki-title').style.display = 'none';
            document.getElementById('giscus-frame-container').style.display = 'none';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-500 bg-slate-900/20 rounded-xl border border-slate-800 border-dashed text-sm">No protocols match selection.</div>`;
                return;
            }

            container.innerHTML = filtered.map(m => buildCardTemplateHtml(m, false)).join('');
        }

        function buildCardTemplateHtml(m, isFocused) {
            return `
                <div onclick="selectNewMethodWiki('${m.method_name}')" class="p-5 border rounded-xl transition-all duration-200 cursor-pointer shadow-md ${m.method_name === activeMethodId && isFocusModeActive ? 'bg-slate-900 border-blue-500 ring-1 ring-blue-500/30' : 'bg-slate-900/40 border-slate-800/80 hover:border-slate-700 hover:bg-slate-900/60'}">
                    <div class="space-y-2">
                        <div class="flex justify-between items-start gap-4">
                            <div>
                                <span class="text-[9px] font-mono font-bold uppercase bg-slate-950/80 border border-slate-800 px-2 py-0.5 rounded text-blue-400 tracking-wide">${m.chemical_class}</span>
                                <h4 class="text-base font-bold text-slate-100 mt-1.5">${m.method_name} <span class="text-slate-500 text-xs font-normal">(${m.year_invented})</span></h4>
                            </div>
                            <span class="text-[10px] font-mono text-emerald-400 font-bold bg-slate-950 px-2 py-0.5 rounded border border-slate-800 tracking-wide shrink-0 shadow-sm">RI ${m.refractive_index}</span>
                        </div>
                        <p class="text-xs text-slate-400 leading-relaxed ${isFocused ? '' : 'line-clamp-2'}">${m.sample_size_compatibility}</p>
                        <div class="flex justify-between items-center pt-2 border-t border-slate-800/40">
                            <div class="flex gap-1.5 flex-wrap">
                                ${m.tissue_compatibilities.map(t => `<span class="text-[9px] font-medium bg-slate-950 px-2 py-0.5 rounded text-slate-400 border border-slate-800/60">📍 ${t}</span>`).join('')}
                            </div>
                            ${isFocused ? '' : '<span class="text-[11px] text-blue-400/90 font-bold group-hover:underline flex items-center gap-1 shrink-0">Open Focus Room &rarr;</span>'}
                        </div>
                    </div>
                </div>
            `;
        }

        function syncGiscusFrameContext() {
            const targetMethod = cachedMethodsRegistry.find(m => m.method_name === activeMethodId);
            const container = document.getElementById('giscus-frame-container');
            if (!targetMethod || !container) return;

            document.getElementById('wiki-title').innerText = `💬 Wiki Discussion Room: ${targetMethod.method_name}`;
            container.innerHTML = ''; 
            
            const giscusScript = document.createElement('script');
            giscusScript.src = "https://giscus.app";
            giscusScript.setAttribute('data-repo', "wildsheet/wildsheet.github.io");
            giscusScript.setAttribute('data-repo-id', "R_kgDOUOWJeg");
            giscusScript.setAttribute('data-category', "General");
            giscusScript.setAttribute('data-category-id', "DIC_kwDOUOWJes4DE315");
            giscusScript.setAttribute('data-mapping', 'specific');
            giscusScript.setAttribute('data-term', targetMethod.method_name); 
            giscusScript.setAttribute('data-strict', '0');
            giscusScript.setAttribute('data-reactions-enabled', '1');
            giscusScript.setAttribute('data-emit-metadata', '0');
            giscusScript.setAttribute('data-input-position', 'top');
            giscusScript.setAttribute('data-theme', 'dark_dimmed');
            giscusScript.setAttribute('data-lang', 'en');
            giscusScript.crossOrigin = "anonymous";
            giscusScript.async = true;
            
            container.appendChild(giscusScript);
        }

        function selectNewMethodWiki(methodId) {
            window.location.hash = methodId;
            activeMethodId = methodId;
            isFocusModeActive = true; 
            renderFilteredRegistry();
            document.getElementById('wiki-title').scrollIntoView({ behavior: 'smooth' });
        }

        function exitFocusViewMode() {
            window.location.hash = '';
            isFocusModeActive = false;
            renderFilteredRegistry();
            document.querySelector('main').scrollIntoView({ behavior: 'smooth' });
        }

        window.addEventListener('DOMContentLoaded', bootstrapRegistryData);
    </script>
</body>
</html>
